# 开窗器网关服务定义

start_pairing:
  name: 开始配对
  description: 启动网关的配对模式以添加新设备
  fields:
    device_id:
      name: 设备ID
      description: 网关设备的唯一标识符
      required: true
      example: "window_gateway_123456"
      selector:
        text:
    duration:
      name: 持续时间
      description: 配对模式持续时间（秒）
      default: 60
      selector:
        number:
          min: 10
          max: 300
          step: 5
          unit_of_measurement: 秒

refresh_devices:
  name: 刷新设备
  description: 触发网关重新发现已配对的设备
  fields:
    device_id:
      name: 设备ID
      description: 网关设备的唯一标识符
      required: true
      example: "window_gateway_123456"
      selector:
        text:

set_position:
  name: 设置位置
  description: 设置特定窗帘/窗户的位置
  fields:
    device_id:
      name: 设备ID
      description: 窗帘设备的唯一标识符
      required: true
      selector:
        text:
    position:
      name: 位置
      description: 目标位置（0-100）
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"

check_gateway_status:
  name: 检查网关状态
  description: 检查网关的在线状态和连接情况
  fields:
    device_id:
      name: 设备ID
      description: 网关设备的唯一标识符
      required: true
      example: "window_gateway_123456"
      selector:
        text:

rename_device:
  name: 重命名设备
  description: 重命名子设备名称，支持自定义房间/位置名称
  fields:
    device_id:
      name: 设备ID
      description: 子设备的唯一标识符
      required: true
      example: "100121501186"
      selector:
        text:
    name:
      name: 新名称
      description: 设备的新名称（如"客厅窗户"）
      required: true
      example: "客厅窗户"
      selector:
        text:

migrate_devices:
  name: 迁移设备
  description: 将子设备从旧网关迁移到新网关（该服务当前暂不可用）
  fields:
    old_gateway_sn:
      name: 旧网关SN
      description: 旧网关的序列号
      required: true
      example: "100121501186"
      selector:
        text:
    new_gateway_sn:
      name: 新网关SN
      description: 新网关的序列号
      required: true
      example: "100121501187"
      selector:
        text:
    remove_old_gateway:
      name: 移除旧网关
      description: 迁移完成后是否移除旧网关
      default: false
      selector:
        boolean:

transfer_device:
  name: 转移设备
  description: 将单个设备从一个网关转移到另一个网关
  fields:
    device_id:
      name: 设备ID
      description: 要转移的设备ID
      required: true
      example: "500534380259"
      selector:
        text:
    new_gateway_sn:
      name: 目标网关SN
      description: 目标网关的序列号
      required: true
      example: "100122501203"
      selector:
        text:
